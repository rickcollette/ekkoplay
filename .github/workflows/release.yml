name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            player-ui/package-lock.json
            admin-ui/package-lock.json
      - run: npm ci
        working-directory: player-ui
      - run: npm ci
        working-directory: admin-ui
      - name: Build release bundles
        run: make release-all VERSION="${GITHUB_REF_NAME#v}"
      - name: Publish verified assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
